services:
  postgress:
    image: postgres:16
    container_name: barber-postgres
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
      POSTGRES_DB: bookingdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d bookingdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.5
    container_name: barber-localstack
    environment:
      SERVICES: s3,sqs,sns,dynamodb
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      EDGE_PORT: "4566"
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh

volumes:
  postgres_data:
  localstack_data:
